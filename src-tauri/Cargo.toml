[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/mcp"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip`：请求带上 `Accept-Encoding: gzip`，响应边收边解压。每日事件那几页 JSON
# 一次就是好几 MB（Charge 30 天 4.7 MB），不压缩就原样走网络。解压后的字节仍受
# `read_json_body` 的上限约束，压缩炸弹撑不爆内存。
reqwest = { version = "0.12", features = ["json", "cookies", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
directories = "5.0"
tracing = "0.1"
base64 = "0.22"
# 原始报文压缩。已经在依赖树里（reqwest 的 gzip 走的是它），这里只是把它
# 变成直接依赖，好在 storage 里显式使用。
flate2 = "1"
# FIT 导出的编码器。rustyfit 同时支持解码和编码 FIT V2（BSD-3-Clause）；
# 生态里其余几个（fitparser / fit_file / fit）只能读，写不了。
rustyfit = "0.10.2"
# rustyfit 的 Write/Seek 是 embedded-io 的 trait，这个适配器把 std 的
# `Cursor<Vec<u8>>` 包成它们。
embedded-io-adapters = { version = "0.7", features = ["std"] }
pacebridge-core = { path = "crates/core" }
