[package]
name = "pacebridge-mcp"
version = "3.2.1"
description = "PaceBridge MCP 服务：stdio、不监听任何端口；写入都能撤销"
edition = "2021"

[[bin]]
name = "pacebridge-mcp"
path = "src/main.rs"

[dependencies]
pacebridge-core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# 测试夹具需要直接写 `ai_tasks` 行——这张表是 S1 v32 的迁移，core 的
# pub(crate) conn 到不了这里，所以测试自己开一条连接建最小形态。
rusqlite = { workspace = true }
